name: full-runtime

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git patch rsync ca-certificates python3 util-linux \
            libssl-dev libgmp-dev libmpfr-dev libboost-dev libzstd-dev zlib1g-dev
      - name: Build pinned dependencies
        run: ./scripts/bootstrap_dependencies.sh .deps 2
      - name: Build and test full runtime
        run: ./scripts/build_and_test.sh full 2 .deps
